name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit

      - name: Build
        run: |
          node node_modules/typescript/bin/tsc -b tsconfig.json
          node node_modules/tsdown/dist/run.mjs

      - name: Test — pure helpers
        run: node --experimental-strip-types tests/core.test.mjs

      - name: Test — tool wiring
        run: node --experimental-strip-types tests/plugin.test.mjs
